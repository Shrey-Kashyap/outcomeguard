services:
  outcomeguard:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      OutcomeGuard__ApiKey: ${OUTCOMEGUARD_API_KEY:?Set OUTCOMEGUARD_API_KEY to a random value of at least 24 characters}
      OutcomeGuard__DemoEnabled: ${OUTCOMEGUARD_DEMO_ENABLED:-true}
    volumes:
      - outcome-data:/data
    restart: unless-stopped

volumes:
  outcome-data:

